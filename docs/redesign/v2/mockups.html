<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f3f1;--ink:#202020;--muted:#8a8a86;--line:#e3e3df;--accent:#2f5bea;--led:#3ddc6f;
  --sans:'DM Sans Variable',sans-serif;--mono:'DM Mono',monospace;--serif:'Instrument Serif',serif}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
.bg-grid{background-image:linear-gradient(#e6e6e2 1px,transparent 1px),linear-gradient(90deg,#e6e6e2 1px,transparent 1px);background-size:32px 32px}
.bg-grid-fine{background-image:linear-gradient(#ececE8 1px,transparent 1px),linear-gradient(90deg,#ececE8 1px,transparent 1px),linear-gradient(#e2e2de 1px,transparent 1px),linear-gradient(90deg,#e2e2de 1px,transparent 1px);background-size:16px 16px,16px 16px,80px 80px,80px 80px}
.bg-dots{background-image:radial-gradient(#cfcfca 1.1px,transparent 1.2px);background-size:18px 18px}
.bg-dots-pink{background-image:radial-gradient(#e6c9df 1px,transparent 1.2px);background-size:12px 12px}
.bg-cross{background-image:
  linear-gradient(#ececE8 1px,transparent 1px),linear-gradient(90deg,#ececE8 1px,transparent 1px);background-size:120px 120px}
.page{position:fixed;inset:0 0 0 112px;overflow:hidden}
.mono{font-family:var(--mono);letter-spacing:.06em}
.caps{text-transform:uppercase;letter-spacing:.16em}
.serif{font-family:var(--serif)}
.abs{position:absolute}

/* ---------- LEFT BAR (chi-style, vertical) ---------- */
.bar{position:fixed;left:0;top:0;bottom:0;width:112px;background:linear-gradient(90deg,#efefed,#e7e7e4);border-right:1px solid #d3d3ce;
  box-shadow:inset -1px 0 0 #fafaf9,6px 0 24px rgba(0,0,0,.04);display:flex;flex-direction:column;align-items:center;padding:22px 0 18px;z-index:10}
.logo{font-family:var(--sans);font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.logo svg{width:20px;height:20px}
.keys{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;border:1px solid #b9b9b4;border-radius:7px;background:#d4d4cf;padding:2px;gap:2px;box-shadow:0 1px 0 #fff}
.key{width:84px;height:62px;border-radius:5px;background:linear-gradient(#f7f7f6,#ebebe8);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 #d9d9d4;position:relative;font-size:13.5px;color:#4a4a47}
.key i{position:absolute;left:9px;top:9px;width:5px;height:5px;border-radius:50%;background:#c4c4bf}
.key span{position:absolute;left:9px;bottom:8px}
.key.on{background:linear-gradient(#e2e2de,#e9e9e6);box-shadow:inset 0 2px 4px rgba(0,0,0,.14)}
.key.on i{background:var(--led);box-shadow:0 0 6px var(--led)}
.minikeys{display:flex;border:1px solid #b9b9b4;border-radius:6px;background:#d4d4cf;padding:2px;gap:2px}
.minikeys .key{width:40px;height:32px;font-family:var(--mono);font-size:10.5px}
.minikeys .key span{left:0;right:0;bottom:auto;top:9px;text-align:center}
.minikeys .key i{display:none}
.iconkey{width:40px;height:34px;display:grid;place-items:center}
.iconkey svg{width:15px;height:15px;stroke:#4a4a47;fill:none;stroke-width:1.8}
.status{margin-top:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:#6a6a66;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.status b{width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
.barlabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#9a9a95;text-transform:uppercase;margin:14px 0 6px}

/* ---------- OBJECTS ---------- */
.photo{background:linear-gradient(160deg,#d9d5cd,#b8b2a7);position:relative;overflow:hidden}
.photo:after{content:'';position:absolute;left:50%;top:22%;width:36%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.38);transform:translateX(-50%)}
.photo:before{content:'';position:absolute;left:50%;bottom:-20%;width:78%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.32);transform:translateX(-50%)}
.polaroid{background:#fbfbfa;padding:14px 14px 54px;border-radius:4px;box-shadow:0 1px 0 #e0e0dc,0 20px 40px -14px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.05)}
.polaroid .cap{position:absolute;left:18px;bottom:16px;font-family:'Space Mono';font-size:13px;color:#777}
.card{background:linear-gradient(135deg,#fdfdfd,#ececec 45%,#f7eef7 70%,#eaeaea);border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.06),inset 0 1px 0 #fff,0 24px 50px -18px rgba(0,0,0,.3);padding:22px}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 18px 40px -16px rgba(0,0,0,.22)}
.thumb{border-radius:10px;position:relative;overflow:hidden}
.thumb .bar2{position:absolute;left:0;right:0;top:0;height:18px;background:rgba(255,255,255,.55);display:flex;gap:4px;align-items:center;padding-left:8px}
.thumb .bar2 i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.25)}
.thumb .blk{position:absolute;background:rgba(255,255,255,.75);border-radius:3px}
.win{background:#fbfbfa;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 22px 50px -18px rgba(0,0,0,.3);overflow:hidden}
.win .tb{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #e5e5e1;font-family:var(--mono);font-size:10.5px;color:#777}
.win .tb i{width:9px;height:9px;border-radius:50%;background:#dcdcd7}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:99px;border:1px solid #dcdcd7;background:#fafaf9;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.chip b{width:6px;height:6px;border-radius:50%;background:#f5b400}
.folder{width:64px;height:50px;border-radius:8px;position:relative;background:#8fbaff;box-shadow:inset 0 -10px 0 rgba(0,0,0,.05)}
.folder:before{content:'';position:absolute;left:0;top:-7px;width:26px;height:10px;border-radius:5px 5px 0 0;background:inherit;filter:brightness(.93)}
.disc{border-radius:50%;background:conic-gradient(from 30deg,#e9e9ef,#cfd8ff,#f3d6f0,#e0f3e9,#e9e9ef,#d6e3ff,#f6e1d0,#e9e9ef);box-shadow:0 18px 40px -16px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.08);position:relative}
.disc:after{content:'';position:absolute;inset:38%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 10px rgba(255,255,255,.7),inset 0 0 0 11px rgba(0,0,0,.08)}
.note{background:#fff3a8;padding:16px;font-family:'Space Mono';font-size:13px;line-height:1.4;box-shadow:0 14px 26px -12px rgba(0,0,0,.3)}
.tape{position:absolute;width:80px;height:24px;background:rgba(240,230,200,.75);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cursor{width:22px;height:22px}
canvas.px{display:inline-block;image-rendering:pixelated;vertical-align:baseline}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.corner{position:absolute;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* mini mac */
.mac{width:250px;height:300px;border-radius:22px 22px 26px 26px;background:linear-gradient(160deg,#fbfbfa,#e7e6e2 70%,#dddcd7);box-shadow:inset 0 2px 0 #fff,inset 0 -6px 10px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);position:relative}
.mac .scr{position:absolute;left:28px;right:28px;top:28px;height:150px;border-radius:12px;background:#d9e7e1;box-shadow:inset 0 3px 8px rgba(0,0,0,.25),0 0 0 6px #ecebe7,0 0 0 7px #d4d3ce;overflow:hidden;display:grid;place-items:center}
.mac .slot{position:absolute;left:120px;right:36px;top:216px;height:8px;border-radius:4px;background:#d2d1cc;box-shadow:inset 0 2px 2px rgba(0,0,0,.18)}
.mac .btns{position:absolute;left:34px;top:208px;display:flex;gap:8px}
.mac .btns i{width:18px;height:18px;border-radius:50%;background:#f3c7cf;box-shadow:inset 0 -2px 2px rgba(0,0,0,.12),0 2px 2px rgba(0,0,0,.1)}
.mac .grill{position:absolute;left:34px;bottom:26px;display:grid;grid-template-columns:repeat(8,4px);gap:4px}
.mac .grill i{width:4px;height:4px;border-radius:50%;background:#cfcec9}
.swatch{width:72px;background:#fff;padding:6px 6px 22px;border-radius:4px;box-shadow:0 10px 22px -10px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.05);position:absolute}
.swatch div{height:64px;border-radius:2px}
.swatch span{position:absolute;left:7px;bottom:6px;font-family:var(--mono);font-size:8.5px;color:#666}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P=[['Las Escuchadoras','2025','Organización de Investigación','#10B981'],['Colmena de Escritores','2024','Editorial Independiente','#7C3AED'],['Jarina de Marco','2024','Artista Musical','#EC4899'],['Lunaria Ritual','2024','Plataforma Editorial','#D97706'],['Brigitte Olivares','2024','Artista Musical','#475569'],['Afrochingonas','2023','Podcast','#F59E0B'],['Del Siervo','2023','Artista Sonoro','#3B82F6'],['Technicolor','2023','Banda Indie','#E11D48'],['Antroposabores','2023','Diplomado','#EA580C'],['Caresaga','2022','Materiales Cosméticos','#06B6D4'],['José Ramírez Guaigua','2022','Artista de Nuevos Medios','#8B5CF6'],['NFTecnológica','2021','Colectivo de Arte','#7C3AED']];
const v=new URLSearchParams(location.search).get('v')||'1';
const ic={in:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v6M8 7.5v.01M12 17v-6M12 13.5a2.5 2.5 0 0 1 5 0V17"/></svg>',
 mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
 arrow:'<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>'};

function bar(active='Inicio'){return `<aside class="bar"><div class="logo">${mark}</div>
 <div class="keys">${['Inicio','Proyectos','Precios','Sobre mí','CV'].map(k=>`<div class="key ${k===active?'on':''}"><i></i><span>${k}</span></div>`).join('')}</div>
 <div class="barlabel">Idioma</div><div class="minikeys"><div class="key on"><span>ES</span></div><div class="key"><span>EN</span></div></div>

 <div class="status"><b></b>Disponible</div></aside>`}
function thumb(c,w,h,seed=0){const s=seed%3;const b=s===0?`<div class="blk" style="left:10%;top:30%;width:46%;height:10%"></div><div class="blk" style="left:10%;top:45%;width:30%;height:5%;opacity:.6"></div><div class="blk" style="left:60%;top:28%;width:30%;height:50%;opacity:.5"></div>`:s===1?`<div class="blk" style="left:8%;top:62%;width:60%;height:12%"></div><div class="blk" style="left:8%;top:30%;width:84%;height:24%;opacity:.4"></div>`:`<div class="blk" style="left:25%;top:34%;width:50%;height:14%"></div><div class="blk" style="left:36%;top:54%;width:28%;height:6%;opacity:.6"></div><div class="blk" style="left:8%;top:78%;width:84%;height:10%;opacity:.35"></div>`;
 return `<div class="thumb" style="width:${w};height:${h};background:linear-gradient(135deg,${c},${c}bb 55%,${c}77)"><div class="bar2"><i></i><i></i><i></i></div>${b}</div>`}
// pixel/dither text placeholder: <span data-px="text" data-size="120" data-font="italic 400 {s}px Instrument Serif" data-scale="4" data-color="#222">
const px=(t,size,opts={})=>`<span data-px="${t}" data-size="${size}" data-font="${opts.font||"italic 400 {s}px 'Instrument Serif'"}" data-scale="${opts.scale||3}" data-color="${opts.color||'#202020'}" data-dither="${opts.dither??1}"></span>`;

const V={
/* 1 — Cindy layout + mini Mac */

 <div class="abs" style="left:64px;top:300px"><div class="mono" style="font-size:19px">hola, soy lorena</div>
   <div style="font-size:88px;font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:18px">Diseño webs</div>

 <div class="abs" style="left:865px;top:330px">${px('con alma.',100)}

 <div class="corner" style="right:34px;bottom:28px">Última actualización 10/26</div>
 <div class="scrollhint">↓ scroll</div></div>`,

2:()=>`<div class="page bg-dots">

 </div>`,

 <div class="abs win" style="left:780px;top:130px;width:500px;transform:rotate(4deg);opacity:.9"><div class="tb"><i></i><i></i><i></i></div>${thumb(P[1][3],'100%','300px',1)}</div>
 <div class="abs win" style="left:720px;top:170px;width:520px;transform:rotate(-2deg)"><div class="tb"><i></i><i></i><i></i></div>${thumb(P[2][3],'100%','310px',2)}</div>
 <div class="abs win" style="left:690px;top:230px;width:540px"><div class="tb"><i></i><i></i><i></i><span style="margin-left:8px">Las Escuchadoras</span></div>${thumb(P[0][3],'100%','320px',0)}</div>

 <div class="scrollhint">↓ scroll</div></div>`,

/* 7 — Sticker collage */

// render pixel/dither text
(async()=>{
 await document.fonts.ready;
 const bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
 for(const el of document.querySelectorAll('[data-px]')){
  const t=el.dataset.px,size=+el.dataset.size,sc=+el.dataset.scale,font=el.dataset.font,color=el.dataset.color,dither=el.dataset.dither==='1';
  await document.fonts.load(font.replace('{s}',size));
  const m=document.createElement('canvas').getContext('2d');m.font=font.replace('{s}',size);
  const w=Math.ceil(m.measureText(t).width+size*.15),h=Math.ceil(size*1.15);
  const c=document.createElement('canvas');c.width=Math.ceil(w/sc);c.height=Math.ceil(h/sc);
  const x=c.getContext('2d');x.font=font.replace('{s}',size/sc);x.fillStyle=color;x.textBaseline='alphabetic';x.fillText(t,0,(size*.88)/sc);x.strokeStyle=color;x.lineWidth=Math.max(.5,size/sc/90);x.strokeText(t,0,(size*.88)/sc);
  const d=x.getImageData(0,0,c.width,c.height);
  for(let i=0;i<d.data.length;i+=4){const p=i/4,px_=p%c.width,py=Math.floor(p/c.width);const a=d.data[i+3]/255;
    const th=dither?.2+.6*(bayer[(py%4)*4+px_%4]+.5)/16:.5;d.data[i+3]=a>th?255:0;}
  x.putImageData(d,0,0);c.className='px';c.style.width=w+'px';c.style.height=h+'px';c.style.verticalAlign=(-size*.27)+'px';
  const w2=document.createElement('span');w2.style.display='inline-block';w2.appendChild(c);el.replaceWith(w2);
 }
 document.body.dataset.ready='1';
})();
